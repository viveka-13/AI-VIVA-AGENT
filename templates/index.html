<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Viva Input</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0a;
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #fff;
        }
        
.container {
    position: relative;
    width: 90%;
    max-width: 500px;
    background: linear-gradient(145deg, #121212, #1a1a1a);
    padding: 30px;
    border-radius: 12px;
    overflow: hidden;
    transition: all 0.3s ease;
}

.container::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: conic-gradient(
        transparent 315deg, 
        #00f2ff 315deg, 
        #00f2ff 360deg, 
        transparent 360deg
    );
    animation: rotate 6s linear infinite;
    opacity: 0.7; /* Consistent glow */
    transition: opacity 0.3s ease;
}

.container::after {
    content: '';
    position: absolute;
    inset: 2px;
    background: linear-gradient(145deg, #121212, #1a1a1a);
    border-radius: 10px;
    transition: all 0.3s ease;
}

        
        h2 {
            font-family: 'Orbitron', sans-serif;
            color: #00f2ff;
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
            letter-spacing: 1px;
        }
        
        form {
            position: relative;
            z-index: 1;
        }
        
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            color: #ffffff;
            font-weight: 300;
            padding-left: 15px;
            transition: all 0.3s ease;
        }
        
        .form-group:hover label {
            color: #00f2ff;
        }
        
        input, select {
            width: 92%;
            padding: 12px 20px;
            background: rgba(30, 30, 30, 0.7);
            border: 2px solid #fff;
            border-radius: 25px;
            color: #fff;
            font-family: 'Roboto', sans-serif;
            transition: all 0.4s ease;
            outline: none;
        }
        
        input:focus, select:focus {
            border-color: #00f2ff;
            background: rgba(40, 40, 40, 0.7);
            box-shadow: 0 0 0 2px rgba(0, 242, 255, 0.2);
        }
        
        .form-group:hover input, 
        .form-group:hover select {
            border-color: #444;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #0077ff, #00f2ff);
            color: #000;
            border: none;
            border-radius: 25px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 500;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            margin-top: 10px;
            z-index: 1;
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, #00f2ff, #0077ff);
            transition: all 0.4s ease;
            z-index: -1;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:hover::before {
            left: 0;
        }
        
        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300f2ff'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 12px;
        }

        /* Faculty login link */
        .faculty-link {
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 100;
            padding: 12px 24px;
            background: linear-gradient(145deg, #121212, #1a1a1a);
            border: 2px solid #00f2ff;
            border-radius: 30px;
            color: #00f2ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 242, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .faculty-link:hover {
            background: rgba(0, 242, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 255, 0.4);
        }
    </style>
</head>
<body>
    <!-- Faculty Portal Link -->
    <a href="/faculty" class="faculty-link">👨‍🏫 Faculty Portal</a>

    <div class="container">
        <h2>Start Student Test</h2>

        <form method="POST" action="/start">
            <div class="form-group">
                <label for="name">Student Name</label>
                <input type="text" id="name" name="name" placeholder="Enter student name" required>
            </div>
            
            <div class="form-group">
                <label for="roll">Roll Number</label>
                <input type="text" id="roll" name="roll" placeholder="Enter roll number" required>
            </div>
            
            <div class="form-group">
                <label for="experiment" id="subject-label">Subject / Experiment</label>
                <select id="experiment" name="experiment" required>
                    <option value="">Loading subjects...</option>
                </select>
            </div>

            <audio id="tts-audio" autoplay></audio>
            
            <button type="submit">
                <span>Start Test</span>
            </button>
        </form>
    </div>

    <script>
        const FALLBACK_EXPERIMENTS = [
            { value: "1", label: "Experiment 1" },
            { value: "2", label: "Experiment 2" },
            { value: "3", label: "Experiment 3" },
            { value: "4", label: "Experiment 4" },
            { value: "5", label: "Experiment 5" },
            { value: "6", label: "Experiment 6" },
            { value: "7", label: "Experiment 7" },
            { value: "8", label: "Experiment 8" },
        ];

        function populateSelect(options, isFaculty) {
            const sel = document.getElementById('experiment');
            const lbl = document.getElementById('subject-label');
            sel.innerHTML = '';

            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = isFaculty ? 'Select Subject' : 'Select Experiment';
            sel.appendChild(placeholder);

            if (lbl) lbl.textContent = isFaculty ? 'Subject' : 'Experiment';

            options.forEach(opt => {
                const o = document.createElement('option');
                o.value = opt.value;
                o.textContent = opt.label;
                sel.appendChild(o);
            });
        }

        window.onload = async function() {
            // Load dynamic subjects from faculty uploads
            try {
                const res = await fetch('/get_subjects');
                const subjects = await res.json();

                if (subjects && subjects.length > 0) {
                    // Use faculty-created subjects
                    const opts = subjects.map(s => ({ value: s.name, label: s.name }));
                    populateSelect(opts, true);
                } else {
                    // Fall back to original experiments
                    populateSelect(FALLBACK_EXPERIMENTS, false);
                }
            } catch (err) {
                // Network error → fall back gracefully
                populateSelect(FALLBACK_EXPERIMENTS, false);
            }

            // Play voice intro
            try {
                const response = await fetch('/voice_intro');
                const data = await response.json();
                console.log("Voice played:", data.message);
            } catch (err) {
                console.error("Failed to play voice:", err);
            }
        };
    </script>
</body>
</html>
